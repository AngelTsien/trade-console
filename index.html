<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>盯盘控制台 · Trade Console</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head><body>
<header id="top"><div class="brand">◈ TRADE<b>CONSOLE</b> <span class="tag">只看不下单</span></div>
<div class="stats"><span>监视代理 <b id="nAg">7</b></span><span>美股 <b id="stUS">—</b></span><span>原油 <b id="stOil">—</b></span><span id="clock">--:--:--</span></div></header>
<main>
<section class="panel left">
 <h3>系统仪表</h3><div class="gauges" id="gauges"></div>
 <h3>监控提醒 <small style="color:#3f9">实时</small></h3><div id="log"></div>
</section>
<section class="center">
 <canvas id="orb"></canvas>
 <div class="core-num"><div id="numLabel">—</div><div id="num">—</div>
 <select id="numSel"><option value="btc">BTC 价格</option><option value="pnl">交易日志净盈亏</option><option value="us">US100 价格</option><option value="oil">USOIL 价格</option></select></div>
</section>
<section class="panel right">
 <h3>市场状态</h3><div id="mkt"></div>
 <h3>日历</h3><div id="cal"></div>
 <h3>提醒统计</h3><div id="bars"></div>
</section>
</main>
<div class="chartbar"><input id="symIn" list="symList" placeholder="添加图表：如 NASDAQ:AAPL"><datalist id="symList"></datalist><button id="symAdd">＋</button><button id="symReset">重置</button><a href="https://www.tradingview.com/chart/" target="_blank" rel="noopener">TradingView ↗</a></div>
<section class="charts" id="charts"></section>
<footer>提醒/心跳/US100·USOIL 报价来自你的 market-watcher（约每 10 分钟同步）；BTC 来自 Coinbase 公共接口；图表为 TradingView 免费嵌入。只读，无任何下单功能。</footer>
<script src="app.js"></script></body></html>
